# Fuente única de verdad de los 38 controles del Anexo A de ISO/IEC 42001:2023.
#
# - Los nombres son TRADUCCIONES LIBRES de referencia hechas por el autor; no son
#   el texto oficial de la norma.
# - Los resúmenes, la evidencia típica y las clasificaciones (roles, esfuerzo,
#   novedad frente a ISO/IEC 27001) son interpretación del autor.
# - Este archivo alimenta la tabla periódica, la matriz filtrable, la Declaración
#   de Aplicabilidad (SoA) en Excel/CSV y la validación de contenido.
#   Si lo modificas, ejecuta:  python scripts/generar_datos.py
#
# Valores permitidos
#   roles:     usa (usa IA de terceros) · desarrolla (desarrolla IA) · provee (provee IA a clientes)
#   esfuerzo:  bajo · medio · alto
#   novedad:   nuevo · similar · equivalente   (frente al Anexo A de ISO/IEC 27001:2022)

objetivos:
  - id: A.2
    nombre: Políticas relacionadas con la IA
    corto: Políticas
    pagina: anexo-a/a2-politicas.md
    clase: obj-a2
    proposito: Que la dirección marque el rumbo del uso y desarrollo de IA con una política clara, coherente con el resto de políticas y revisada a tiempo.
  - id: A.3
    nombre: Organización interna
    corto: Organización
    pagina: anexo-a/a3-organizacion-interna.md
    clase: obj-a3
    proposito: Que siempre haya personas con nombre y apellido responsables de la IA, y un canal seguro para levantar la mano cuando algo preocupa.
  - id: A.4
    nombre: Recursos para sistemas de IA
    corto: Recursos
    pagina: anexo-a/a4-recursos.md
    clase: obj-a4
    proposito: Saber con qué está hecho cada sistema de IA (datos, herramientas, infraestructura y personas) para poder entender sus riesgos e impactos.
  - id: A.5
    nombre: Evaluación de impactos de los sistemas de IA
    corto: Impacto
    pagina: anexo-a/a5-evaluacion-de-impacto.md
    clase: obj-a5
    proposito: Mirar hacia afuera de la organización y valorar cómo un sistema de IA puede afectar a personas, grupos y a la sociedad durante todo su ciclo de vida.
  - id: A.6
    nombre: Ciclo de vida del sistema de IA
    corto: Ciclo de vida
    pagina: anexo-a/a6-ciclo-de-vida.md
    clase: obj-a6
    proposito: Diseñar, construir, probar, desplegar y operar sistemas de IA con criterios definidos y documentados en cada etapa.
  - id: A.7
    nombre: Datos para sistemas de IA
    corto: Datos
    pagina: anexo-a/a7-datos.md
    clase: obj-a7
    proposito: Entender y controlar el papel de los datos en el comportamiento de la IA, desde su obtención hasta su preparación.
  - id: A.8
    nombre: Información para las partes interesadas
    corto: Información
    pagina: anexo-a/a8-informacion-partes-interesadas.md
    clase: obj-a8
    proposito: Que usuarios, clientes y autoridades tengan la información necesaria para entender el sistema, reportar problemas y enterarse de incidentes.
  - id: A.9
    nombre: Uso de sistemas de IA
    corto: Uso
    pagina: anexo-a/a9-uso.md
    clase: obj-a9
    proposito: Usar la IA de forma responsable, con objetivos claros, supervisión humana y dentro de su uso previsto.
  - id: A.10
    nombre: Relaciones con terceros y clientes
    corto: Terceros
    pagina: anexo-a/a10-terceros.md
    clase: obj-a10
    proposito: Repartir con claridad las responsabilidades con proveedores, socios y clientes sin perder la rendición de cuentas propia.

controles:
  # ---------------------------------------------------------------- A.2
  - id: A.2.2
    nombre: Política de IA
    objetivo: A.2
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["5.1"]
    resumen: Documentar una política aprobada por la dirección que fije principios y reglas para desarrollar o usar sistemas de IA.
    evidencia: Política de IA aprobada y vigente; registro de comunicación; procedimiento de excepciones.
  - id: A.2.3
    nombre: Alineación con otras políticas de la organización
    objetivo: A.2
    roles: [usa, desarrolla, provee]
    esfuerzo: bajo
    novedad: similar
    iso27001: ["5.1"]
    resumen: Identificar qué otras políticas (seguridad, privacidad, calidad, compras, ética) tocan a la IA y ajustarlas o referenciarlas.
    evidencia: Matriz de cruce entre políticas; políticas actualizadas con referencias a IA.
  - id: A.2.4
    nombre: Revisión de la política de IA
    objetivo: A.2
    roles: [usa, desarrolla, provee]
    esfuerzo: bajo
    novedad: equivalente
    iso27001: ["5.1"]
    resumen: Revisar la política de IA a intervalos definidos y cuando haya cambios relevantes (legales, técnicos o de negocio).
    evidencia: Historial de versiones; minutas de revisión; insumos de la revisión por la dirección.
  # ---------------------------------------------------------------- A.3
  - id: A.3.2
    nombre: Roles y responsabilidades de IA
    objetivo: A.3
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["5.2", "5.3"]
    resumen: Definir y asignar quién hace qué en la IA (riesgos, impacto, datos, supervisión humana, proveedores, cumplimiento legal).
    evidencia: Matriz RACI de IA; descripciones de puesto; nombramientos firmados.
  - id: A.3.3
    nombre: Reporte de inquietudes
    objetivo: A.3
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["6.8"]
    resumen: Habilitar un canal confidencial, con protección contra represalias, para que el personal reporte inquietudes sobre la IA.
    evidencia: Procedimiento del canal; registros de reportes y su atención; comunicación del canal al personal.
  # ---------------------------------------------------------------- A.4
  - id: A.4.2
    nombre: Documentación de recursos
    objetivo: A.4
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["5.9"]
    resumen: Identificar y documentar los recursos que cada sistema de IA necesita en cada etapa de su ciclo de vida.
    evidencia: Inventario de sistemas de IA con sus recursos; diagramas de arquitectura y de flujo de datos.
  - id: A.4.3
    nombre: Recursos de datos
    objetivo: A.4
    roles: [desarrolla, provee]
    esfuerzo: alto
    novedad: nuevo
    iso27001: ["5.9", "5.12"]
    resumen: Documentar los conjuntos de datos del sistema de IA (origen, fechas, categorías, etiquetado, calidad, sesgos conocidos, retención).
    evidencia: Fichas de conjuntos de datos (datasheets); catálogo de datos; metadatos de versiones.
  - id: A.4.4
    nombre: Recursos de herramientas
    objetivo: A.4
    roles: [desarrolla, provee]
    esfuerzo: bajo
    novedad: similar
    iso27001: ["5.9"]
    resumen: Documentar algoritmos, modelos, bibliotecas, plataformas y herramientas usadas para construir y evaluar la IA.
    evidencia: Inventario de herramientas y modelos con versiones; lista de componentes (AI-BOM o SBOM).
  - id: A.4.5
    nombre: Recursos de sistema y cómputo
    objetivo: A.4
    roles: [desarrolla, provee]
    esfuerzo: bajo
    novedad: equivalente
    iso27001: ["5.9", "8.6"]
    resumen: Documentar la infraestructura (nube, local, borde), capacidad y su impacto, incluido el ambiental, que usa la IA.
    evidencia: Inventario de infraestructura; planes de capacidad; datos de consumo energético cuando existan.
  - id: A.4.6
    nombre: Recursos humanos
    objetivo: A.4
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["6.3"]
    resumen: Documentar las personas y competencias necesarias en cada etapa del ciclo de vida, incluidas las de supervisión humana.
    evidencia: Matriz de competencias; planes de capacitación; perfiles de puesto relacionados con IA.
  # ---------------------------------------------------------------- A.5
  - id: A.5.2
    nombre: Proceso de evaluación de impacto
    objetivo: A.5
    roles: [usa, desarrolla, provee]
    esfuerzo: alto
    novedad: nuevo
    iso27001: []
    resumen: Establecer un proceso para valorar las consecuencias que un sistema de IA puede tener en personas, grupos y sociedades.
    evidencia: Procedimiento de evaluación de impacto con disparadores, responsables, método y criterios.
  - id: A.5.3
    nombre: Documentación de las evaluaciones de impacto
    objetivo: A.5
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: nuevo
    iso27001: []
    resumen: Documentar los resultados de cada evaluación de impacto y conservarlos durante un periodo definido.
    evidencia: Evaluaciones de impacto firmadas y versionadas; política de retención aplicada.
  - id: A.5.4
    nombre: Evaluación del impacto en individuos o grupos
    objetivo: A.5
    roles: [usa, desarrolla, provee]
    esfuerzo: alto
    novedad: nuevo
    iso27001: []
    resumen: Valorar y documentar cómo el sistema puede afectar derechos, oportunidades, seguridad o bienestar de personas y grupos.
    evidencia: Sección de impactos individuales de la evaluación; consulta con expertos o usuarios; medidas de mitigación.
  - id: A.5.5
    nombre: Evaluación de impactos sociales
    objetivo: A.5
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: nuevo
    iso27001: []
    resumen: Valorar y documentar efectos amplios en la sociedad (ambientales, económicos, democráticos, culturales, de salud).
    evidencia: Sección de impactos sociales de la evaluación; análisis de uso indebido; vínculo con la estrategia de sostenibilidad.
  # ---------------------------------------------------------------- A.6
  - id: A.6.1.2
    nombre: Objetivos para el desarrollo responsable
    objetivo: A.6
    roles: [desarrolla, provee]
    esfuerzo: medio
    novedad: nuevo
    iso27001: []
    resumen: Definir objetivos de desarrollo responsable (equidad, seguridad, transparencia…) y convertirlos en medidas en cada etapa.
    evidencia: Objetivos documentados; requisitos derivados en historias de usuario o criterios de aceptación.
  - id: A.6.1.3
    nombre: Procesos para el diseño y desarrollo responsable
    objetivo: A.6
    roles: [desarrolla, provee]
    esfuerzo: alto
    novedad: similar
    iso27001: ["8.25", "8.27"]
    resumen: Definir el proceso de desarrollo de IA con etapas, pruebas, aprobaciones, criterios de liberación y supervisión humana.
    evidencia: Procedimiento del ciclo de vida; puertas de aprobación (stage gates); registros de aprobaciones.
  - id: A.6.2.2
    nombre: Requisitos y especificación
    objetivo: A.6
    roles: [desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["8.26"]
    resumen: Especificar y documentar por qué y para qué se construye o mejora un sistema de IA y qué requisitos debe cumplir.
    evidencia: Documento de requisitos o caso de negocio; requisitos de datos, desempeño y supervisión.
  - id: A.6.2.3
    nombre: Documentación del diseño y desarrollo
    objetivo: A.6
    roles: [desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["8.27", "8.28"]
    resumen: Documentar las decisiones de diseño (enfoque de aprendizaje, modelo, datos, amenazas, interfaz humana) y la arquitectura final.
    evidencia: Documento de diseño; registros de decisiones de arquitectura (ADR); modelo de amenazas de IA.
  - id: A.6.2.4
    nombre: Verificación y validación
    objetivo: A.6
    roles: [desarrolla, provee]
    esfuerzo: alto
    novedad: similar
    iso27001: ["8.29"]
    resumen: Definir cómo se prueba el sistema de IA, con qué datos y con qué criterios de aceptación, incluidos sesgo y robustez.
    evidencia: Plan de pruebas; reportes de evaluación por segmento; criterios de liberación firmados.
  - id: A.6.2.5
    nombre: Despliegue
    objetivo: A.6
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["8.31", "8.32"]
    resumen: Documentar un plan de despliegue y verificar que se cumplen los requisitos antes de poner el sistema en producción.
    evidencia: Plan de despliegue; lista de verificación de salida a producción; aprobación de la dirección.
  - id: A.6.2.6
    nombre: Operación y monitoreo
    objetivo: A.6
    roles: [usa, desarrolla, provee]
    esfuerzo: alto
    novedad: similar
    iso27001: ["8.16", "8.6", "8.8"]
    resumen: Definir cómo se opera, monitorea (desempeño, deriva, amenazas propias de la IA), repara, actualiza y da soporte al sistema.
    evidencia: Tableros de monitoreo; umbrales y alertas de deriva; registros de cambios y soporte.
  - id: A.6.2.7
    nombre: Documentación técnica
    objetivo: A.6
    roles: [desarrolla, provee]
    esfuerzo: medio
    novedad: nuevo
    iso27001: ["5.37"]
    resumen: Determinar qué documentación técnica necesita cada parte interesada (usuarios, socios, autoridades) y entregarla en forma adecuada.
    evidencia: Ficha del sistema o del modelo; manual de operación; plan de manejo de fallas.
  - id: A.6.2.8
    nombre: Registro de eventos
    objetivo: A.6
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["8.15", "8.17"]
    resumen: Decidir en qué etapas se registran eventos del sistema de IA, como mínimo durante su uso, y cuánto tiempo se conservan.
    evidencia: Configuración de bitácoras; muestras de registros; política de retención de registros.
  # ---------------------------------------------------------------- A.7
  - id: A.7.2
    nombre: Datos para desarrollo y mejora
    objetivo: A.7
    roles: [desarrolla, provee]
    esfuerzo: alto
    novedad: nuevo
    iso27001: []
    resumen: Definir e implementar procesos de gestión de datos para desarrollar y mejorar sistemas de IA (privacidad, seguridad, representatividad).
    evidencia: Procedimiento de gestión de datos para IA; aprobaciones de uso de datos; análisis de representatividad.
  - id: A.7.3
    nombre: Adquisición de datos
    objetivo: A.7
    roles: [desarrolla, provee]
    esfuerzo: medio
    novedad: nuevo
    iso27001: []
    resumen: Documentar cómo se obtienen y seleccionan los datos (fuentes, cantidad, derechos de uso, datos personales, sesgos conocidos).
    evidencia: Registro de fuentes de datos; licencias y contratos de datos; base legal del tratamiento.
  - id: A.7.4
    nombre: Calidad de los datos
    objetivo: A.7
    roles: [usa, desarrolla, provee]
    esfuerzo: alto
    novedad: nuevo
    iso27001: []
    resumen: Definir requisitos de calidad de datos y comprobar que los datos de entrenamiento, prueba y operación los cumplen.
    evidencia: Requisitos de calidad por conjunto; reportes de perfilado; métricas de sesgo y completitud.
  - id: A.7.5
    nombre: Procedencia de los datos
    objetivo: A.7
    roles: [desarrolla, provee]
    esfuerzo: medio
    novedad: nuevo
    iso27001: []
    resumen: Registrar de dónde vienen los datos y qué transformaciones y transferencias han sufrido durante su ciclo de vida.
    evidencia: Registros de linaje (lineage); versionado de conjuntos de datos; cadena de custodia.
  - id: A.7.6
    nombre: Preparación de los datos
    objetivo: A.7
    roles: [desarrolla, provee]
    esfuerzo: medio
    novedad: nuevo
    iso27001: []
    resumen: Definir criterios y métodos de preparación (limpieza, imputación, normalización, etiquetado, codificación) y documentarlos.
    evidencia: Procedimiento o cuaderno de preparación versionado; justificación de transformaciones; guía de etiquetado.
  # ---------------------------------------------------------------- A.8
  - id: A.8.2
    nombre: Documentación del sistema e información para usuarios
    objetivo: A.8
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: nuevo
    iso27001: []
    resumen: Dar a los usuarios la información que necesitan (que interactúan con IA, propósito, límites, cómo anular o escalar).
    evidencia: Avisos de interacción con IA; instrucciones de uso; criterios documentados de qué informar.
  - id: A.8.3
    nombre: Reporte externo
    objetivo: A.8
    roles: [usa, desarrolla, provee]
    esfuerzo: bajo
    novedad: nuevo
    iso27001: ["6.8"]
    resumen: Ofrecer a usuarios y terceros un medio para reportar impactos adversos del sistema de IA y darle seguimiento.
    evidencia: Formulario o buzón publicado; registro de reportes recibidos y su atención.
  - id: A.8.4
    nombre: Comunicación de incidentes
    objetivo: A.8
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["5.24", "5.26", "5.5"]
    resumen: Documentar un plan para comunicar incidentes de IA a los usuarios y, cuando aplique, a autoridades.
    evidencia: Plan de comunicación de incidentes de IA; plantillas de aviso; registros de notificaciones.
  - id: A.8.5
    nombre: Información para las partes interesadas
    objetivo: A.8
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["5.31", "5.5"]
    resumen: Identificar y documentar las obligaciones de informar sobre el sistema de IA a clientes, reguladores u otras partes.
    evidencia: Registro de obligaciones de reporte; reportes entregados; contactos con autoridades.
  # ---------------------------------------------------------------- A.9
  - id: A.9.2
    nombre: Procesos para el uso responsable
    objetivo: A.9
    roles: [usa, desarrolla]
    esfuerzo: medio
    novedad: similar
    iso27001: ["5.10"]
    resumen: Definir cómo se decide y aprueba el uso de un sistema de IA (aprobaciones, costos, compras, requisitos legales).
    evidencia: Procedimiento de alta de casos de uso de IA; política de uso aceptable; aprobaciones registradas.
  - id: A.9.3
    nombre: Objetivos para el uso responsable
    objetivo: A.9
    roles: [usa, desarrolla]
    esfuerzo: bajo
    novedad: nuevo
    iso27001: []
    resumen: Fijar objetivos de uso responsable (equidad, transparencia, privacidad…) y decidir dónde se necesita supervisión humana.
    evidencia: Objetivos de uso documentados; definición de puntos de supervisión humana; indicadores.
  - id: A.9.4
    nombre: Uso previsto del sistema de IA
    objetivo: A.9
    roles: [usa, desarrolla]
    esfuerzo: medio
    novedad: nuevo
    iso27001: []
    resumen: Asegurar que el sistema se usa conforme a su uso previsto y su documentación, y escalar cuando no sea así.
    evidencia: Declaración de uso previsto; registros de operación; escalamientos al proveedor.
  # ---------------------------------------------------------------- A.10
  - id: A.10.2
    nombre: Asignación de responsabilidades
    objetivo: A.10
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["5.19", "5.20", "5.23"]
    resumen: Repartir y documentar las responsabilidades del ciclo de vida entre la organización, socios, proveedores y clientes.
    evidencia: Matriz de responsabilidad compartida; cláusulas contractuales; roles de protección de datos definidos.
  - id: A.10.3
    nombre: Proveedores
    objetivo: A.10
    roles: [usa, desarrolla, provee]
    esfuerzo: medio
    novedad: similar
    iso27001: ["5.19", "5.20", "5.21", "5.22"]
    resumen: Asegurar que lo que entregan los proveedores (datos, modelos, sistemas) sea coherente con el enfoque responsable de la organización.
    evidencia: Evaluaciones de proveedores de IA; cuestionarios; documentación recibida; seguimiento periódico.
  - id: A.10.4
    nombre: Clientes
    objetivo: A.10
    roles: [provee]
    esfuerzo: medio
    novedad: nuevo
    iso27001: ["5.20"]
    resumen: Considerar las necesidades y expectativas de los clientes y comunicarles los límites y responsabilidades del sistema.
    evidencia: Requisitos de clientes; contratos y términos de uso; documentación entregada al cliente.

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 724" role="img" aria-labelledby="ig-phva-sgia-t ig-phva-sgia-d">
<title id="ig-phva-sgia-t">El ciclo PHVA del sistema de gestión de IA y sus cláusulas</title>
<desc id="ig-phva-sgia-d">Ciclo de cuatro fases que gira en el sentido de las manecillas del reloj alrededor de la cláusula 5, Liderazgo. Planificar agrupa la cláusula 4 (contexto), la 6 (planificación: riesgos, impacto, Declaración de Aplicabilidad y objetivos) y la 7 (apoyo), que habilita todas las fases. Hacer corresponde a la cláusula 8, Operación, con 8.1 control operacional, 8.2 evaluación de riesgos, 8.3 tratamiento de riesgos y 8.4 evaluación de impacto. Verificar corresponde a la cláusula 9 con 9.1 seguimiento y medición, 9.2 auditoría interna y 9.3 revisión por la dirección. Actuar corresponde a la cláusula 10 con 10.1 mejora continua y 10.2 no conformidad y acción correctiva. Entran el contexto, las partes interesadas y los requisitos aplicables; salen una IA responsable y objetivos de IA cumplidos.</desc>
<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700">El ciclo PHVA del SGIA</text>
<text x="400" y="84" text-anchor="middle" font-size="14" font-weight="700">Entran</text>
<text x="400" y="104" text-anchor="middle" font-size="13" class="ig-muted">contexto, partes interesadas</text>
<text x="400" y="121" text-anchor="middle" font-size="13" class="ig-muted">y requisitos aplicables</text>

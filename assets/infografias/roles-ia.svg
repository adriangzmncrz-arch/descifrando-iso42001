<text x="256" y="680" font-size="15" font-weight="700">Productor</text>
<text x="256" y="700" font-size="13" class="ig-muted">ciclo de vida y datos</text>
<a href="../../anexo-a/a6-ciclo-de-vida/"><text x="256" y="728" font-size="14" font-weight="700" text-decoration="underline">A.6 Ciclo de vida</text></a>
<a href="../../anexo-a/a7-datos/"><text x="256" y="750" font-size="14" font-weight="700" text-decoration="underline">A.7 Datos</text></a>
</g>
<g class="obj-a8">
<rect x="456" y="654" width="206" height="112" rx="10" class="ig-tint"/>
<rect x="456" y="654" width="6" height="112" rx="3" class="ig-obj"/>
<text x="474" y="680" font-size="15" font-weight="700">Proveedor</text>
<text x="474" y="700" font-size="13" class="ig-muted">información y clientes</text>
<a href="../../anexo-a/a8-informacion-partes-interesadas/"><text x="474" y="728" font-size="14" font-weight="700" text-decoration="underline">A.8 Información</text></a>
<a href="../../anexo-a/a10-terceros/#a-10-4"><text x="474" y="750" font-size="14" font-weight="700" text-decoration="underline">A.10.4 Clientes</text></a>
</g>
<g class="obj-a10">
<rect x="674" y="654" width="206" height="112" rx="10" class="ig-tint"/>
<rect x="674" y="654" width="6" height="112" rx="3" class="ig-obj"/>
<text x="692" y="680" font-size="15" font-weight="700">Socio</text>
<text x="692" y="700" font-size="13" class="ig-muted">reparto y procedencia</text>
<a href="../../anexo-a/a10-terceros/#a-10-2"><text x="692" y="728" font-size="14" font-weight="700" text-decoration="underline">A.10.2 Responsabilidades</text></a>
<a href="../../anexo-a/a7-datos/#a-7-5"><text x="692" y="750" font-size="14" font-weight="700" text-decoration="underline">A.7.5 Procedencia</text></a>
</g>
<text x="450" y="796" text-anchor="middle" font-size="13" class="ig-muted">Sujetos y autoridades no se certifican como rol, pero elevan la exigencia de A.5 (impacto) y A.8 (transparencia).</text>
<a href="../../herramientas/selector-de-rol/"><text x="450" y="820" text-anchor="middle" font-size="14" font-weight="700" text-decoration="underline">¿Cuál es tu rol? Usa el selector de rol</text></a>
</svg>

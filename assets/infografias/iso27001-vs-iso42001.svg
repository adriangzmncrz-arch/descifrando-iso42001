<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 904" role="img" aria-labelledby="ig-iso27001-vs-iso42001-t ig-iso27001-vs-iso42001-d">
<title id="ig-iso27001-vs-iso42001-t">Del SGSI con ISO 27001:2022 al SGIA con ISO/IEC 42001: lo compartido, lo que se adapta y lo nuevo</title>
<desc id="ig-iso27001-vs-iso42001-d">Tres columnas. Compartido, reutilizas tu SGSI: estructura armonizada de las cláusulas 4 a 10; información documentada, 7.5; competencia y toma de conciencia, 7.2 y 7.3; comunicación, 7.4; planificación de cambios, 6.3; auditoría interna, 9.2; revisión por la dirección, 9.3; mejora y acción correctiva, 10.1 y 10.2. Ejemplo: un solo programa de auditoría interna con criterios de ambas normas. Se adapta, amplías lo que existe: contexto con propósito previsto y roles, 4.1 y 4.2; riesgo más allá de confidencialidad, integridad y disponibilidad, 6.1.1, 6.1.2 y 8.2; Declaración de Aplicabilidad con otros 38 controles, 6.1.3; política de IA, 5.2 y A.2; proveedores de IA, A.10.2 y A.10.3; registros de eventos, A.6.2.8; incidentes de IA, A.8.4; inventario y recursos, A.4. Ejemplo: la matriz de riesgos agrega consecuencias para personas y sociedad. Nuevo, construyes desde cero: evaluación de impacto, 6.1.4, 8.4 y A.5; desarrollo y uso responsable, A.6.1.2 y A.9.3; datos para IA, A.7.2 a A.7.6; transparencia a usuarios, A.8.2 y A.8.3; uso previsto, A.9.4; supervisión humana, A.9.3, A.6.1.3 y A.4.6; documentación técnica, A.6.2.7; información a clientes, A.10.4. Ejemplo: aviso en el chatbot de que la persona conversa con un asistente de IA. Abajo, una barra con los 38 controles del Anexo A de ISO/IEC 42001 según la clasificación del autor frente al Anexo A de ISO 27001:2022: 2 equivalentes, 19 similares y 17 nuevos.</desc>
<text x="450" y="32" text-anchor="middle" font-size="21" font-weight="700">Del SGSI al SGIA: tres zonas de trabajo</text>
<text x="450" y="58" text-anchor="middle" font-size="15" class="ig-muted">ISO/IEC 27001:2022 → ISO/IEC 42001:2023</text>

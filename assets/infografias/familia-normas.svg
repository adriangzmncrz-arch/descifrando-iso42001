<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" role="img" aria-labelledby="ig-familia-normas-t ig-familia-normas-d">
<title id="ig-familia-normas-t">Mapa de la familia de normas de IA alrededor de ISO/IEC 42001</title>
<desc id="ig-familia-normas-d">ISO/IEC 42001 al centro, como la única norma certificable de la familia de IA, rodeada por siete grupos de normas relacionadas. Fundamentos: ISO/IEC 22989 (conceptos, terminología y roles; referencia normativa) e ISO/IEC 23053 (marco para sistemas con aprendizaje automático). Gobernanza: ISO/IEC 38507. Riesgo e impacto: ISO/IEC 23894, ISO/IEC 42005 e ISO 31000. Sesgo y ética: ISO/IEC TR 24027, ISO/IEC TS 12791 e ISO/IEC TR 24368. Certificación: ISO/IEC 42006 e ISO/IEC 17021-1, requisitos para organismos de certificación. Ciclo de vida y calidad: ISO/IEC 5338, ISO/IEC 25059, la serie ISO/IEC 5259, ISO/IEC TR 24029-1 e ISO/IEC TS 4213. Sistemas hermanos: ISO/IEC 27001, ISO/IEC 27701 e ISO 9001, también certificables en sus propios temas. Una leyenda distingue cuatro tipos: requisitos certificables para organizaciones (relleno índigo), requisitos para organismos de certificación (relleno cian), normas de orientación o marco (contorno continuo) e informes y especificaciones técnicas (contorno punteado).</desc>
<text x="450" y="32" text-anchor="middle" font-size="19" font-weight="700">La familia de normas alrededor de ISO/IEC 42001</text>
<text x="450" y="54" text-anchor="middle" font-size="13" class="ig-muted">Agrupadas por tema. El estilo de cada etiqueta indica su tipo (ver la leyenda).</text>

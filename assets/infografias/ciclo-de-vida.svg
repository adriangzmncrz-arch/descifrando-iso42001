<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 980" role="img" aria-labelledby="ig-ciclo-de-vida-t ig-ciclo-de-vida-d">
<title id="ig-ciclo-de-vida-t">Rueda del ciclo de vida del sistema de IA con los controles de A.6 y A.7</title>
<desc id="ig-ciclo-de-vida-d">Rueda del ciclo de vida de un sistema de IA con siete etapas en el sentido de las agujas del reloj: 1 Concepción (A.6.2.2 requisitos y A.7.2 gestión de datos); 2 Diseño y desarrollo (A.6.2.3 decisiones de diseño y arquitectura, A.7.3 adquisición, A.7.6 preparación y A.7.5 procedencia de datos); 3 Verificar y validar (A.6.2.4 pruebas y criterios, A.7.4 calidad de datos); 4 Despliegue (A.6.2.5 plan de despliegue); 5 Operación y monitoreo (A.6.2.6 monitoreo y soporte, A.7.4 datos de producción); 6 Revalidar y mejorar (A.6.2.6 reentrenamiento, A.6.2.4 revalidación, A.6.2.2 mejora material); 7 Retiro (A.6.1.3 plan de retiro, A.6.2.8 conservar registros); del retiro, una línea punteada regresa a la concepción. Al centro, el gobierno del desarrollo (A.6.1): A.6.1.2 objetivos y A.6.1.3 proceso con puertas de aprobación. Abajo, como transversales a todo el ciclo: A.6.2.7 documentación técnica por tipo de parte interesada y A.6.2.8 registro de eventos, obligatorio al menos durante la operación. Cada control es un enlace a su explicación.</desc>
<text x="24" y="36" font-size="19" font-weight="700">La rueda del ciclo de vida</text>
<text class="ig-muted" x="24" y="60" font-size="14">Cada chip lleva a la explicación de su control</text>

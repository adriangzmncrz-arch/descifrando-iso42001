name: Publicar versión

# Al subir una etiqueta vX.Y.Z crea el release de GitHub con las notas del
# CHANGELOG y un ZIP de las plantillas (con la licencia CC BY-SA 4.0).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Crear release con las plantillas
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Empaquetar las plantillas
        run: |
          NOMBRE="descifrando-iso42001-plantillas-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix="${NOMBRE}/" -o "${NOMBRE}.zip" "${GITHUB_REF_NAME}" plantillas LICENSE
          echo "ZIP=${NOMBRE}.zip" >> "$GITHUB_ENV"

      - name: Extraer las notas del CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '/^## \[/{p = (index($0, "## [" ver "]") == 1); next} p && !/^\[[^]]+\]: http/' CHANGELOG.md > notas.md
          if ! grep -q '[^[:space:]]' notas.md; then
            echo "::error::CHANGELOG.md no tiene una sección [$VERSION]"
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "📖 **Lee la guía:** https://adriangzmncrz-arch.github.io/descifrando-iso42001/"
            echo
            echo "📦 **Plantillas:** descarga \`${ZIP}\` (Markdown, Excel y CSV). Contenido bajo CC BY-SA 4.0: cita la fuente y comparte con la misma licencia."
          } >> notas.md

      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Descifrando ISO 42001 ${GITHUB_REF_NAME}" --notes-file notas.md --verify-tag

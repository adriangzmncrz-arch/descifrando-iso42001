site_name: Descifrando ISO 42001
site_url: https://adriangzmncrz-arch.github.io/descifrando-iso42001/
site_description: >-
  Guía interpretativa abierta en español para entender e implementar
  ISO/IEC 42001:2023, el sistema de gestión de inteligencia artificial (SGIA):
  qué pide la norma, por qué lo pide y cómo se ve en la práctica.
site_author: Carlos Adrián Guzmán
repo_url: https://github.com/adriangzmncrz-arch/descifrando-iso42001
repo_name: descifrando-iso42001
edit_uri: edit/main/docs/
copyright: >-
  Contenido © 2026 Carlos Adrián Guzmán ·
  <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es">CC BY-SA 4.0</a> ·
  Código bajo licencia MIT ·
  Interpretación del autor: no sustituye a la norma ISO/IEC 42001 ni es asesoría legal.

theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/img/logo.svg
  favicon: assets/img/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Cambiar a modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Usar la preferencia del sistema
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

plugins:
  - search:
      lang: es

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/adriancruz-grc/
      name: Carlos Adrián Guzmán en LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/adriangzmncrz-arch
      name: Repositorios del autor en GitHub
    - icon: material/shield-lock-outline
      link: https://github.com/adriangzmncrz-arch/iso27001-toolkit-es
      name: Proyecto hermano — ISO 27001 Toolkit en español
    - icon: material/web
      link: https://cipherwell-sec.com
      name: Cipherwell

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/controles-data.js
  - javascripts/matriz.js
  - javascripts/autodiagnostico.js
  - javascripts/selector-rol.js

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Enlace permanente a esta sección
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abreviaturas.md
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde


<text x="432" y="368" font-size="13" font-weight="700" class="ig-muted">Pregunta guía</text>
<text x="432" y="388" font-size="15">¿A quién puede beneficiar o perjudicar</text>
<text x="432" y="407" font-size="15">este sistema, de qué forma y cuánto?</text>
<line x1="432" y1="422" x2="764" y2="422" class="ig-line" stroke-width="1"/>

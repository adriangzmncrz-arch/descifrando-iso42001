<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 646" role="img" aria-labelledby="ig-riesgo-vs-impacto-t ig-riesgo-vs-impacto-d">
<title id="ig-riesgo-vs-impacto-t">Evaluación de riesgos de IA frente a evaluación de impacto del sistema de IA</title>
<desc id="ig-riesgo-vs-impacto-d">Dos columnas. A la izquierda, la evaluación de riesgos de IA: pone en el centro a la organización y sus objetivos de IA; protege la capacidad de lograrlos y de cumplir obligaciones; considera consecuencias para la organización, las personas y la sociedad, con probabilidad y nivel de riesgo; pregunta qué puede impedir o ayudar a lograr los objetivos y qué tan grave es; produce riesgos priorizados que llevan a tratamiento, controles y Declaración de Aplicabilidad. A la derecha, la evaluación de impacto del sistema de IA: pone en el centro a las personas, los grupos y la sociedad; protege derechos, oportunidades, bienestar y seguridad; considera desarrollo, suministro, uso previsto y uso indebido previsible en su contexto; pregunta a quién puede beneficiar o perjudicar el sistema, cómo y cuánto; produce impactos documentados, mitigaciones y un insumo para evaluar riesgos. Una flecha va de la columna de impacto a la de riesgos: los resultados del impacto alimentan la evaluación de riesgos. Abajo, los puntos de la norma: 6.1.2 y 8.2 para riesgos; 6.1.4, 8.4 y el tema A.5 del Anexo A para impacto.</desc>
<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700">Dos evaluaciones, dos miradas</text>

<text x="92" y="106" font-size="18" font-weight="700" class="ig-on-color">riesgos de IA</text>
<text x="36" y="152" font-size="13" font-weight="700" class="ig-muted">En el centro</text>
<text x="36" y="172" font-size="15">La organización y sus objetivos de IA</text>

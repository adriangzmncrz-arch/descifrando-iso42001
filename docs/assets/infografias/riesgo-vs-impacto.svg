<text x="36" y="296" font-size="13" font-weight="700" class="ig-muted">Considera</text>
<text x="36" y="316" font-size="15">Consecuencias para la organización, las</text>
<text x="36" y="335" font-size="15">personas y la sociedad; probabilidad y nivel</text>
<line x1="36" y1="350" x2="368" y2="350" class="ig-line" stroke-width="1"/>
<text x="36" y="368" font-size="13" font-weight="700" class="ig-muted">Pregunta guía</text>
<text x="36" y="388" font-size="15">¿Qué puede impedir o ayudar a lograr</text>
<text x="36" y="407" font-size="15">nuestros objetivos, y qué tan grave es?</text>
<line x1="36" y1="422" x2="368" y2="422" class="ig-line" stroke-width="1"/>
<text x="36" y="440" font-size="13" font-weight="700" class="ig-muted">Produce</text>
<text x="36" y="460" font-size="15">Riesgos priorizados → tratamiento,</text>
<text x="36" y="479" font-size="15">controles y Declaración de Aplicabilidad</text>
